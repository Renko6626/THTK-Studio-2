[package]
name = "script-check"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "thtk-check"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
directories = "5"

[dev-dependencies]
tempfile = "3"
